  <!-- ============ ASSESSMENT MODAL ============ -->
  <div id="assessment-modal" class="modal-overlay">
    <div class="modal-card bg-white rounded-modal w-[680px] max-w-[94vw] max-h-[90vh] overflow-hidden flex flex-col">
      <div class="px-6 py-4 flex items-center justify-between border-b border-content-divider">
        <div class="flex items-center gap-3">
          <div id="assessment-modal-icon" class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:rgba(109,94,246,0.1)">
            <i class="fa-solid fa-brain text-brand-purple"></i>
          </div>
          <div>
            <h3 id="assessment-modal-title" class="font-display font-bold text-base text-content-text">测评</h3>
            <p id="assessment-modal-desc" class="text-[11px] text-content-sub">请根据你的真实想法作答</p>
          </div>
        </div>
        <button class="w-8 h-8 rounded-lg hover:bg-content-divider flex items-center justify-center text-content-sub hover:text-content-text transition" onclick="closeAssessmentModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="px-6 py-3 border-b border-content-divider bg-gray-50">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs text-content-sub">答题进度</span>
          <span id="assessment-progress-text" class="text-xs font-medium text-brand-purple">1 / 10</span>
        </div>
        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
          <div id="assessment-progress-bar" class="h-full bg-gradient-to-r from-brand-purple to-brand-cyan transition-all duration-300" style="width:10%"></div>
        </div>
      </div>

      <div id="assessment-questions" class="flex-1 overflow-y-auto p-6">
        <!-- Questions will be rendered here -->
      </div>

      <div class="px-6 py-4 flex items-center justify-between border-t border-content-divider" style="background:#FAFBFC">
        <button id="assessment-prev" class="btn-ghost px-4 py-2 rounded-lg text-sm" onclick="assessmentPrev()" disabled>
          <i class="fa-solid fa-arrow-left mr-1.5"></i>上一题
        </button>
        <button id="assessment-next" class="btn-primary px-4 py-2 rounded-lg text-sm" onclick="assessmentNext()">
          下一题<i class="fa-solid fa-arrow-right ml-1.5"></i>
        </button>
      </div>
    </div>
  </div>
