  <!-- ============ FILTER MODAL ============ -->
  <div id="filter-modal" class="modal-overlay">
    <div class="modal-card bg-white rounded-modal w-[440px] max-w-[92vw] overflow-hidden">
      <div class="px-6 py-4 flex items-center justify-between border-b border-content-divider">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:rgba(109,94,246,0.1)">
            <i class="fa-solid fa-filter text-brand-purple"></i>
          </div>
          <h3 class="font-display font-bold text-base text-content-text">筛选任务</h3>
        </div>
        <button class="w-8 h-8 rounded-lg hover:bg-content-divider flex items-center justify-center text-content-sub hover:text-content-text transition" onclick="closeModal('filter-modal')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-2 text-content-text">任务状态</label>
          <div class="flex flex-wrap gap-2" id="filter-status">
            <span class="chip" data-status="pending">待开始</span>
            <span class="chip" data-status="progress">进行中</span>
            <span class="chip" data-status="verifying">验证中</span>
            <span class="chip" data-status="passed">已通过</span>
            <span class="chip" data-status="rejected">需修改</span>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-content-text">任务类型</label>
          <div class="flex flex-wrap gap-2" id="filter-type">
            <span class="chip" data-type="A">A 类 · 代码</span>
            <span class="chip" data-type="B">B 类 · 报告</span>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-content-text">优先级</label>
          <div class="flex flex-wrap gap-2" id="filter-priority">
            <span class="chip" data-priority="high">高</span>
            <span class="chip" data-priority="mid">中</span>
            <span class="chip" data-priority="low">低</span>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 flex gap-3 border-t border-content-divider" style="background:#FAFBFC">
        <button class="btn-ghost flex-1 py-2.5 rounded-lg text-sm" onclick="resetFilter()">重置</button>
        <button class="btn-primary flex-1 py-2.5 rounded-lg text-sm" onclick="applyFilter()">应用筛选</button>
      </div>
    </div>
  </div>
